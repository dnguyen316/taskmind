taskmind.auth.e2e-bypass.enabled=false
taskmind.auth.otp.fixed-code=
spring.datasource.url=${TASKMIND_DB_URL}
spring.datasource.username=${TASKMIND_DB_USERNAME}
spring.datasource.password=${TASKMIND_DB_PASSWORD}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${TASKMIND_AUTH_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${TASKMIND_AUTH_JWK_SET_URI}
taskmind.auth.jwt.issuer=${TASKMIND_JWT_ISSUER}
taskmind.auth.jwt.audience=${TASKMIND_JWT_AUDIENCE}
taskmind.auth.jwt.secret=${TASKMIND_JWT_SECRET}
taskmind.nova.base-url=${TASKMIND_NOVA_BASE_URL}
taskmind.nova.service-token=${TASKMIND_NOVA_SERVICE_TOKEN:${TASKMIND_AI_SERVICE_TOKEN}}
taskmind.relay.client.base-url=${TASKMIND_RELAY_BASE_URL}
taskmind.relay.client.service-token=${TASKMIND_RELAY_SERVICE_TOKEN}
taskmind.integrations.token-key=${TASKMIND_INTEGRATIONS_TOKEN_KEY}
taskmind.integrations.token-key-version=${TASKMIND_INTEGRATIONS_TOKEN_KEY_VERSION}
taskmind.notifications.email.delivery=${TASKMIND_NOTIFICATIONS_EMAIL_DELIVERY:fake}
taskmind.notifications.slack.delivery=${TASKMIND_NOTIFICATIONS_SLACK_DELIVERY:fake}
