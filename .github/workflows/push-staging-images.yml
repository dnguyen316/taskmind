name: Build and push staging images

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    # Loads variables and secrets from:
    # Settings → Environments → staging
    environment: staging

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: core
            dockerfile: apps/backend/Dockerfile

          - service: relay
            dockerfile: apps/relay/Dockerfile

          - service: nova
            dockerfile: apps/ai/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image configuration
        id: image
        shell: bash
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}

          CORE_REPOSITORY: ${{ vars.ECR_CORE_REPOSITORY }}
          RELAY_REPOSITORY: ${{ vars.ECR_RELAY_REPOSITORY }}
          NOVA_REPOSITORY: ${{ vars.ECR_NOVA_REPOSITORY }}

          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail

          case "${SERVICE}" in
            core)
              repository="${CORE_REPOSITORY}"
              ;;
            relay)
              repository="${RELAY_REPOSITORY}"
              ;;
            nova)
              repository="${NOVA_REPOSITORY}"
              ;;
            *)
              echo "Unknown service: ${SERVICE}" >&2
              exit 1
              ;;
          esac

          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          image="${registry}/${repository}"

          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
